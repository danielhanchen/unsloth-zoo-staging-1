name: "staging-1183 windows-latest"
on:
  push:
    branches: ["pr-1183-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      # unsloth_zoo/__init__ refuses to import without the `unsloth` package,
      # BEFORE the UNSLOTH_IS_PRESENT spoof is consulted, and the absent-dep
      # escape below then turns that into a green leg that ran no tests. This
      # skips the GPU init block that raises, which is what a CPU runner wants.
      UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: rc=0; python -m pytest tests/test_compile_dynamo_disabled_fullgraph.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then broke=$(grep -cE "ERROR collecting " pytest_out.txt) || broke=0; dep=$(grep -cE '^E +.*(No module named .(torch|unsloth_zoo|transformers).|ImportError. Please install Unsloth via .pip install unsloth.!)' pytest_out.txt) || dep=0; if [ "$broke" -gt 0 ] && [ "$broke" = "$dep" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt) || tot=0; dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
